[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "panda-popdex-agent-wallet"
version = "0.2.0"
description = "Local POPDEX Agent wallet creation and authorization CLI"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "httpx>=0.27,<1",
  "web3>=7,<8",
]

[project.scripts]
popdex-agent-wallet = "panda_agent_wallet.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/panda_agent_wallet"]
